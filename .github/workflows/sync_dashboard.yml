name: Sync Dashboard Comercial Qali Kay

on:
  schedule:
    # Ejecuta a las 07:35 y 15:35 hora de Lima (UTC-5) -> 12:35 y 20:35 UTC
    - cron: '35 12 * * *'
    - cron: '35 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl pyarrow

      - name: Run ETL Sync from RPA Google Sheets
        run: |
          python src/etl_ventas_defontana.py --sync-rpa

      - name: Run Commercial Portfolio Rules Engine
        run: |
          python src/motor_reglas_carteras.py

      - name: Export Dashboard Payload & Inject HTML
        run: |
          python src/exportar_datos_dashboard.py
          cp ejecucion/PROTOTIPO_DASHBOARD_VENTAS_QALIKAY.html index.html

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ejecucion/PROTOTIPO_DASHBOARD_VENTAS_QALIKAY.html data/datos_comerciales.json index.html data/ventas_2025_2026.parquet data/alertas_comerciales_consolidadas.json data/resumen_carteras.json data/maestro_articulos_abastecimiento.csv
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-sync cloud: Sincronizacion comercial RPA Defontana [$(date -u +'%Y-%m-%d %H:%M:%S UTC')]"
            git push origin main
          fi
